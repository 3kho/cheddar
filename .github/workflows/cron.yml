# Frequent cron for Vercel Hobby (whose own cron only runs once a day).
# Repo secrets needed: APP_URL (e.g. https://cheddar.vercel.app) and CRON_SECRET.
name: cron
on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  mouse:
    if: github.event.schedule != '*/15 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Mouse re-quote
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          url="$(printf '%s' "$APP_URL" | tr -d '[:space:]')"; url="${url%/}"
          case "$url" in http://*|https://*) ;; *) url="https://$url" ;; esac
          secret="$(printf '%s' "$CRON_SECRET" | tr -d '\r\n')"
          curl -fsS -H "Authorization: Bearer $secret" "$url/api/cron/mouse"
  churn:
    if: github.event.schedule != '*/5 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Churn
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          url="$(printf '%s' "$APP_URL" | tr -d '[:space:]')"; url="${url%/}"
          case "$url" in http://*|https://*) ;; *) url="https://$url" ;; esac
          secret="$(printf '%s' "$CRON_SECRET" | tr -d '\r\n')"
          curl -fsS -H "Authorization: Bearer $secret" "$url/api/cron/churn"
