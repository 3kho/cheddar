name: Slack resync (every 10 min)

on:
  # Runs every 10 minutes, 24 h a day
  schedule:
    - cron: '*/10 * * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd packages/db
          pnpm install --frozen-lockfile
        # Adjust path if your monorepo structure differs

      - name: Run Slack resync script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          cd scripts
          node slack-resync.ts